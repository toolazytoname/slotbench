[package]
name = "slotbench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Neutral public Solana RPC/gRPC relative-arrival stopwatch"
repository = "https://github.com/toolazytoname/slotbench"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
